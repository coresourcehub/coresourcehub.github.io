<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="theme-color" content="#112f46"><title>Case Research Record | CO Resource Hub</title><style>
:root{color-scheme:light;--ink:#183046;--muted:#526778;--navy:#112f46;--blue:#17689b;--line:#d9e2e8;--bg:#f6f8fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}a{color:var(--blue)}a:focus-visible{outline:3px solid #d4a14e;outline-offset:3px}.top{background:var(--navy);color:white}.top .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;padding-top:18px;padding-bottom:18px}.top nav{display:flex;gap:14px;flex-wrap:wrap}.top a{color:#e6f3fc}.wrap{max-width:980px;margin:auto;padding:0 20px}.paper{background:#fff;border:1px solid var(--line);border-radius:16px;margin:24px auto 40px;padding:26px;max-width:900px}.eyebrow{font-size:.76rem;letter-spacing:.11em;text-transform:uppercase;color:#56768a;font-weight:800}h1{line-height:1.2;font-size:clamp(1.7rem,5vw,2.45rem);margin:14px 0}h2{font-size:1.23rem;margin:0 0 9px}p{margin:0 0 12px}.sub{color:var(--muted)}.notice{background:#ecf3f8;border-left:4px solid #2479a8;padding:15px;border-radius:8px;margin:19px 0}.section{border-top:1px solid var(--line);padding-top:18px;margin-top:22px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0}.facts div{min-width:0}.facts dt{font-size:.84rem;font-weight:760;color:#536e7e}.facts dd{margin:3px 0;overflow-wrap:anywhere}.topics{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.topic{font-size:.8rem;background:#e8f1f7;border-radius:6px;padding:4px 9px}.link{display:inline-block;border:1px solid #b5ccdb;border-radius:9px;padding:10px 13px;font-weight:720;text-decoration:none;margin:8px 10px 0 0}.footer{background:var(--navy);color:#d3e4ef;padding:24px 0;font-size:.88rem}.muted{font-size:.88rem;color:#596e7a}#error{color:#8a2e2b} @media(max-width:650px){.facts{grid-template-columns:1fr}.paper{padding:19px;margin:17px auto}.wrap{padding-left:16px;padding-right:16px}}
</style></head><body><header class="top"><div class="wrap"><strong>CO Resource Hub · Litigation Archive</strong><nav aria-label="Site navigation"><a href="/">Home</a><a href="/litigation/">← Case directory</a><a href="/policy-library/">Policy Library</a></nav></div></header><main class="wrap"><article class="paper" id="detail"><p class="sub">Loading case research record…</p></article></main><footer class="footer"><div class="wrap">Independent public-record research · Not affiliated with or endorsed by CDOC or the courts.</div></footer><script>
'use strict';
const target=document.getElementById('detail');
function n(tag,txt,cls){const x=document.createElement(tag);if(txt!==undefined&&txt!==null)x.textContent=txt;if(cls)x.className=cls;return x}
function addSection(label,content){const section=n('section',undefined,'section');section.append(n('h2',label));section.append(n('p',content||'Not independently verified.'));target.append(section)}
function pair(dl,label,value){const div=n('div');div.append(n('dt',label),n('dd',value||'Not verified'));dl.append(div)}
function safeLink(url){try{const u=new URL(url);return u.protocol==='https:'?u.href:null}catch{return null}}
function parseCSV(csv){const output=[];let row=[],cell='',q=false;csv=csv.replace(/^\uFEFF/,'');for(let i=0;i<csv.length;i++){const c=csv[i];if(q){if(c==='"'&&csv[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&csv[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v!==''))output.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>v!==''))output.push(row);const fields=output.shift()||[];return output.map(r=>Object.fromEntries(fields.map((h,i)=>[h,r[i]||''])))}
const get=(r,k)=>(r[k]||'').trim();
(async()=>{try{
const query=new URLSearchParams(location.search),docket=(query.get('docket')||'').trim(),court=(query.get('court')||'').trim();
if(!docket||!court)throw Error('No case selected');
const response=await fetch('./cases.csv',{cache:'no-store'});if(!response.ok)throw Error('CSV HTTP '+response.status);
const rows=parseCSV(await response.text());
const r=rows.find(r=>get(r,'Docket / case number')===docket&&get(r,'Court')===court);
target.replaceChildren();
if(!r){target.append(n('h1','Case not found'),n('p','That case may have moved or been corrected in a newer research dataset.'));const a=n('a','← Browse the case directory','link');a.href='/litigation/';target.append(a);return}
const title=get(r,'Case title')||'Untitled case';document.title=title+' | CDOC Litigation Archive';
const a=n('a','← Back to case directory','link');a.href='/litigation/';target.append(a);
target.append(n('div','Public-record discovery · Preliminary research','eyebrow'),n('h1',title));
const note=n('aside',undefined,'notice');note.append(n('strong','Important research limitation. '),n('span','Allegations and named parties are not judicial findings. A docket entry does not establish liability or wrongdoing. Check the official court record before relying on the summary or any disposition.'));target.append(note);
const facts=n('dl',undefined,'facts');pair(facts,'Docket / case number',get(r,'Docket / case number'));pair(facts,'Court',get(r,'Court'));pair(facts,'Court level (source field)',get(r,'Court level'));pair(facts,'Filing year (verification pending)',get(r,'Filing year (verify)'));pair(facts,'Plaintiff representation',get(r,'Plaintiff representation'));pair(facts,'Review stage',get(r,'Review stage'));pair(facts,'Evidence level',get(r,'Summary evidence level'));pair(facts,'Case disposition / status',get(r,'Case disposition / status'));pair(facts,'Last research check',get(r,'Last research check'));target.append(facts);
addSection('Research summary',get(r,'Preliminary summary / source-verified event')||'Summary pending review.');
addSection('Issue / allegation details',get(r,'Issue / allegation detail'));
const tags=n('div',undefined,'topics');for(const k of get(r,'Preliminary keywords').split(';').map(s=>s.trim()).filter(Boolean)){tags.append(n('span',k,'topic'))}if(tags.childNodes.length){const section=n('section',undefined,'section');section.append(n('h2','Research keywords'),tags);target.append(section)}
addSection('Named people / entities (search index)',get(r,'Named persons / entities (search index)'));
addSection('Research / linking notes',get(r,'Research / linking notes'));
addSection('Source document type',get(r,'Source document type'));
const sources=n('section',undefined,'section');sources.append(n('h2','Public court sources'));const url=safeLink(get(r,'Public source URL'));if(url){const link=n('a','Open original source ↗','link');link.href=url;link.target='_blank';link.rel='noopener noreferrer';sources.append(link)}else sources.append(n('p','No verified HTTPS source URL in the current CSV.'));sources.append(n('p','This record is generated from the supplied CSV. It is not a complete case analysis, a transcript of the court record, or an automatically refreshed docket.','muted'));target.append(sources);
}catch(err){target.replaceChildren(n('h1','Unable to load case'),n('p',err.message,'sub'))}})();
</script></body></html>
