name: Deploy complete CO Resource Hub site

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag containing the Policy Library ZIP"
        required: true
        default: "library-beta-v1"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the homepage
        uses: actions/checkout@v4

      - name: Validate litigation source data and related proceedings
        run: |
          set -euo pipefail
          python3 scripts/check-litigation-publication.py

      - name: Create deployment site
        run: |
          set -euo pipefail
          mkdir -p _site/policy-library
          cp index.html _site/index.html
          if [ -d assets ]; then cp -R assets _site/assets; fi
          if [ -d facilities ]; then cp -R facilities _site/facilities; fi
          if [ -d legislation ]; then cp -R legislation _site/legislation; fi
          if [ -d litigation ]; then cp -R litigation _site/litigation; fi
          test -s _site/litigation/index.html
          test -s _site/litigation/case.html
          test -s _site/litigation/cases.csv
          test -s _site/legislation/index.html
          test -s _site/legislation/bill.html
          test -s _site/legislation/data/bills.json

      - name: Download approved Policy Library archive from release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'CDOC_Policy_Library_All_Series_Research_Beta.zip' \
            --dir /tmp/cdoc-policy-archive
          test -s /tmp/cdoc-policy-archive/CDOC_Policy_Library_All_Series_Research_Beta.zip

      - name: Extract policy library, preserve source PDFs and form previews
        run: |
          set -euo pipefail
          unzip -q /tmp/cdoc-policy-archive/CDOC_Policy_Library_All_Series_Research_Beta.zip -d _site/policy-library
          test -s _site/policy-library/index.html
          test -s _site/policy-library/assets/library.json
          test -d _site/policy-library/pdfs
          test -d _site/policy-library/previews
          rm -f _site/policy-library/partial_records.json
          touch _site/.nojekyll
          printf 'Policy PDFs: '
          find _site/policy-library/pdfs -type f -name '*.pdf' | wc -l
          printf 'Preview images: '
          find _site/policy-library/previews -type f | wc -l

      - name: Add consistent homepage navigation to Policy Library
        run: |
          set -euo pipefail
          python3 scripts/add-library-navigation.py

      - name: Add consistent navigation to Policy Library pages
        run: python3 scripts/add_policy_navigation.py

      - name: Add CDOC AR index and HB25-1013 references
        run: python3 scripts/add_ar_index_references.py

      - name: Add seven uploaded illustrated card artworks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/co-home-art _site/assets/home-art
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'homepage_illustrations_seven*.zip' \
            --dir /tmp/co-home-art
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archives=list(Path('/tmp/co-home-art').glob('homepage_illustrations_seven*.zip'))
          if len(archives)!=1:
              raise SystemExit(f'Expected one homepage illustrations ZIP in release; found {len(archives)}')
          names=('policy-library','share-experience','legislation-reform','research-findings','facilities-directory','organizations-resources','purpose-independence')
          out=Path('_site/assets/home-art')
          with ZipFile(archives[0]) as archive:
              contents=set(archive.namelist())
              for name in names:
                  item=f'{name}-transparent.png'
                  if item not in contents:
                      raise SystemExit(f'Missing illustration: {item}')
                  payload=archive.read(item)
                  if not payload.startswith(b'\x89PNG\r\n\x1a\n'):
                      raise SystemExit(f'Unexpected image format: {item}')
                  (out/f'{name}.png').write_bytes(payload)
          print(f'Installed {len(names)} transparent homepage illustrations')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload assembled website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
